<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Bem-vindo(a) — AD Rio Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{display:flex;justify-content:center;background:linear-gradient(145deg,#eaf4ff 0%,#f7fbff 52%,#fff4ed 100%);}
  .wrap{max-width:460px;width:100%;min-height:100vh;background:#fff;box-shadow:0 0 45px rgba(15,35,64,.1);}
  .hero{
    background:linear-gradient(160deg, var(--blue-600), var(--blue-400));
    padding:42px 26px 34px;color:#fff;text-align:center;position:relative;overflow:hidden;
    box-shadow:0 14px 30px rgba(11,79,168,.18);
  }
  .hero:after{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(255,255,255,.18);border-radius:50%;right:-82px;bottom:-110px;box-shadow:0 0 0 18px rgba(255,255,255,.06),0 0 0 36px rgba(255,255,255,.04);}
  .hero>*{position:relative;z-index:1;}
  .hero img{width:64px;height:64px;border-radius:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .hero h1{font-size:22px;margin:0 0 8px;font-weight:800;}
  .hero p{margin:0;font-size:13.5px;color:#DCEEFF;line-height:1.5;}
  .form-area{padding:30px 24px 44px;}
  .success{display:none;text-align:center;padding:76px 30px 48px;}
  .success .ic{
    width:78px;height:78px;border-radius:24px;background:var(--green-100);color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;
    box-shadow:0 10px 24px rgba(30,158,107,.14);
  }
  .success .ic svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
  .success.is-visible .ic{animation:confirmation-pop .65s cubic-bezier(.2,.9,.3,1.25) both;}
  .success.is-visible .ic svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:confirmation-check .45s .35s ease-out forwards;}
  .success.is-visible h2,.success.is-visible p{animation:confirmation-rise .5s .18s ease-out both;}
  @keyframes confirmation-pop{0%{opacity:0;transform:scale(.35) rotate(-12deg)}70%{opacity:1;transform:scale(1.1) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes confirmation-check{to{stroke-dashoffset:0}}
  @keyframes confirmation-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .success h2{margin:0 0 8px;font-size:19px;}
  .success p{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
  .success .new-registration{margin-top:8px;}
  .success.is-visible .new-registration{animation:confirmation-rise .5s .35s ease-out both;}
</style>
</head>
<body>
<div class="wrap">
  <div id="formScreen">
    <div class="hero">
      <img src="assets/logo-mark.png" alt="Logo AD Rio Verde">
      <h1>Bem-vindo(a) à família AD Rio Verde</h1>
      <p>Que bom ter você aqui! Conta um pouquinho sobre você — é rapidinho.</p>
    </div>
    <div class="form-area">
      <label>Seu nome completo *</label>
      <input type="text" id="nome" placeholder="Como você se chama?">
      <label>WhatsApp *</label>
      <input type="tel" id="telefone" placeholder="(62) 9 0000-0000">
      <label>Faz parte de alguma igreja? *</label>
      <select id="fazParteIgreja">
        <option value="">Selecione</option>
        <option value="Sim">Sim</option>
        <option value="Não">Não</option>
      </select>
      <button class="btn-ember block" style="margin-top:22px" onclick="enviar()">
        <i class="ti ti-send"></i>Enviar
      </button>
    </div>
  </div>
  <div class="success" id="successScreen">
    <div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg></div>
    <h2>Recebemos seus dados!</h2>
    <p>Foi muito bom ter você com a gente. Em breve alguém da nossa equipe vai te procurar.</p>
    <button class="btn-outline block new-registration" type="button" onclick="cadastrarOutro()">
      <i class="ti ti-user-plus"></i>Cadastrar outro
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="store.js"></script>
<script>
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function enviar(){
  var nome = document.getElementById('nome').value.trim();
  if(!nome){ showToast('Preencha seu nome completo.'); return; }
  var telefone = document.getElementById('telefone').value.trim();
  if(!telefone){ showToast('Preencha seu WhatsApp.'); return; }
  var fazParteIgreja = document.getElementById('fazParteIgreja').value;
  if(!fazParteIgreja){ showToast('Responda se faz parte de alguma igreja.'); return; }
  Store.addPerson({
    nome: nome,
    telefone: telefone,
    fazParteIgreja: fazParteIgreja,
    notas: 'Faz parte de alguma igreja? ' + fazParteIgreja,
    quemColeta: 'Autocadastro (QR code)',
    stage: 'visitante'
  });
  document.getElementById('formScreen').style.display = 'none';
  document.getElementById('successScreen').style.display = 'block';
  document.getElementById('successScreen').classList.add('is-visible');
}
function cadastrarOutro(){
  document.getElementById('nome').value = '';
  document.getElementById('telefone').value = '';
  document.getElementById('fazParteIgreja').value = '';
  document.getElementById('successScreen').classList.remove('is-visible');
  document.getElementById('successScreen').style.display = 'none';
  document.getElementById('formScreen').style.display = 'block';
  document.getElementById('nome').focus();
}
</script>
</body>
</html>
