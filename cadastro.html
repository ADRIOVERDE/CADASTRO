<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — AD Rio Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{display:flex;justify-content:center;background:linear-gradient(135deg,#eaf3ff 0%,#f7fbff 42%,#fff4ed 100%);padding:28px 16px;}
  .wrap{max-width:500px;width:100%;min-height:calc(100vh - 56px);background:#fff;border:1px solid rgba(255,255,255,.86);border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(10,45,89,.16);}
  .hero{
    background:linear-gradient(145deg,#082d5b 0%,var(--blue-600) 55%,#218dea 100%);
    padding:34px 30px 27px;color:#fff;text-align:center;position:relative;overflow:hidden;
  }
  .hero:before,.hero:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none;}
  .hero:before{width:220px;height:220px;right:-105px;top:-115px}.hero:after{width:145px;height:145px;left:-78px;bottom:-105px}
  .hero > *{position:relative;z-index:1}
  .hero img{width:56px;height:56px;border-radius:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .hero h1{font-size:22px;margin:0 0 7px;font-weight:800;letter-spacing:-.03em;}
  .hero p{margin:0;font-size:13px;color:#DCEEFF;line-height:1.5;}
  .form-area{padding:26px 30px 34px;}
  .form-intro{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:var(--blue-50);color:var(--blue-700);font-size:12px;font-weight:600;margin-bottom:22px;}.form-intro i{font-size:18px;color:var(--blue-500)}
  .form-section{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-600);margin:25px 0 3px;display:flex;align-items:center;gap:8px;}.form-section:after{content:'';height:1px;background:var(--line);flex:1}
  .conditional{border-left:3px solid var(--blue-400);padding:2px 0 2px 13px;margin-top:12px;background:linear-gradient(90deg,var(--blue-50),transparent);border-radius:2px;}
  .success{display:none;text-align:center;padding:60px 26px;}
  .success .ic{
    width:74px;height:74px;border-radius:50%;background:var(--green-100);color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;
  }
  .success h2{margin:0 0 8px;font-size:22px;}
  .success p{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
  .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:transparent;padding:0;}
  .seg button{min-height:44px;justify-content:flex-start;text-align:left;background:#fff;border:1px solid var(--line);color:var(--ink-soft);box-shadow:none;font-size:12px;padding:9px 11px;}.seg button:hover{border-color:var(--blue-400);background:var(--blue-50)}.seg button.active{background:var(--blue-600);border-color:var(--blue-600);color:#fff;box-shadow:0 6px 14px rgba(11,79,168,.2)}
  .field-row-2{gap:12px}.field-row-2 > div{min-width:0}.form-area .btn-ember{min-height:49px;border-radius:13px;box-shadow:0 10px 20px rgba(255,122,61,.24)}
  @media(max-width:560px){body{padding:0;background:#fff}.wrap{min-height:100vh;border-radius:0;border:0;box-shadow:none}.hero{padding:30px 24px 25px}.form-area{padding:23px 20px 32px}.seg{grid-template-columns:1fr}.field-row-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div id="formScreen">
    <div class="hero">
      <img src="assets/logo-mark.png" alt="Logo AD Rio Verde">
      <h1>Jornada de recepção</h1>
      <p>Formulário da equipe — preencha com os dados de quem acabou de chegar.</p>
    </div>
    <div class="form-area">
      <div class="form-intro"><i class="ti ti-heart-handshake"></i><span>Seu cuidado começa com um cadastro bem feito.</span></div>
      <div class="form-section">Dados da pessoa</div>
      <label>Nome completo *</label>
      <input type="text" id="nome" placeholder="Nome completo, sem abreviar">
      <label>WhatsApp *</label>
      <input type="tel" id="telefone" placeholder="(62) 9 0000-0000">
      <label>E-mail (para o cadastro na plataforma) *</label>
      <input type="email" id="email" placeholder="nome@email.com">
      <label>Igreja que a pessoa frequenta *</label>
      <select id="congregacao">
        <option value="">Selecione a igreja</option>
        <option value="36034">AD | Amorinópolis</option>
        <option value="36026">AD | Aragarças</option>
        <option value="36035">AD | Arenópolis</option>
        <option value="36036">AD | Barra do Garças</option>
        <option value="36037">AD | Betel</option>
        <option value="36038">AD | Boa Vista</option>
        <option value="36039">AD | Bom Jardim</option>
        <option value="36040">AD | Caiapônia</option>
        <option value="36041">AD | Canaã</option>
        <option value="36042">AD | Céu Azul/Girassol</option>
        <option value="36043">AD | Dona Ilza</option>
        <option value="36044">AD | Doverlândia</option>
        <option value="36045">AD | Gameleira 1</option>
        <option value="36046">AD | Genoveva</option>
        <option value="36047">AD | Jardim Adriana</option>
        <option value="36027">AD | Jardim Floresta</option>
        <option value="36048">AD | Jardim Helena</option>
        <option value="36049">AD | Lage</option>
        <option value="36050">AD | Laranjeiras</option>
        <option value="36051">AD | Maranata</option>
        <option value="36052">AD | Mariana</option>
        <option value="36053">AD | Montividu</option>
        <option value="36054">AD | Morada do Sol</option>
        <option value="36028">AD | Palestina</option>
        <option value="36055">AD | Paulo Campos</option>
        <option value="36056">AD | Piranhas</option>
        <option value="36057">AD | Planalto Verde</option>
        <option value="36015">AD | Pontal dos Buritis</option>
        <option value="36016">AD | Popular</option>
        <option value="36017">AD | Primavera</option>
        <option value="36018">AD | Promissão</option>
        <option value="36019">AD | Recanto do Bosque</option>
        <option value="36020">AD | Riverlândia</option>
        <option value="36021">AD | Rondonópolis</option>
        <option value="36029">AD | Santo Agostinho</option>
        <option value="36022">AD | Santo Antônio da Barra</option>
        <option value="36014">AD | Sede</option>
        <option value="36023">AD | Serra Dourada</option>
        <option value="36024">AD | Vaianópolis</option>
        <option value="36025">AD | Veneza</option>
        <option value="36030">AD | Vila Borges</option>
        <option value="36031">AD | Vila Maria</option>
        <option value="36032">AD | Vila Olinda</option>
      </select>
      <label>Situação *</label>
      <div class="form-section">Situação e acompanhamento</div>
      <div class="seg" id="categoriaSeg">
        <button type="button" data-v="visitante" onclick="setCategoria(this)">Visitante</button>
        <button type="button" data-v="convertido" onclick="setCategoria(this)">Aceitou Jesus agora</button>
        <button type="button" data-v="reconciliado" onclick="setCategoria(this)">Reconciliação</button>
        <button type="button" data-v="novo_membro" onclick="setCategoria(this)">Veio de outra igreja</button>
      </div>
      <div id="wrapComum" style="display:none">
        <div class="field-row-2">
          <div>
            <label>Bairro *</label>
            <input type="text" id="bairro" placeholder="Qual bairro">
          </div>
          <div>
            <label>Idade *</label>
            <input type="number" id="idade" placeholder="Anos" min="0">
          </div>
        </div>
        <label>Estado civil *</label>
        <select id="estadoCivil" onchange="toggleConjugeCampo()">
          <option value="">Selecione</option>
          <option>Solteiro(a)</option>
          <option>Casado(a)</option>
          <option>Divorciado(a)</option>
          <option>Viúvo(a)</option>
        </select>
        <div id="wrapConjuge" style="display:none">
          <label>Nome do cônjuge *</label>
          <input type="text" id="nomeConjuge" placeholder="Nome completo do(a) cônjuge">
        </div>
      </div>
      <div id="wrapReconciliado" style="display:none">
        <label>Em qual igreja aceitou Jesus pela primeira vez? *</label>
        <input type="text" id="igrejaAnterior" placeholder="Nome da igreja">
      </div>
      <div id="wrapNovoMembro" style="display:none">
        <label>Tem carta de transferência? *</label>
        <div class="seg" id="segCarta">
          <button type="button" data-v="Sim" onclick="setSeg('segCarta','temCarta',this)">Sim</button>
          <button type="button" data-v="Não" onclick="setSeg('segCarta','temCarta',this)">Não</button>
        </div>
        <input type="hidden" id="temCarta">
        <div id="wrapFuncao" class="conditional" style="display:none">
          <label>Exercia alguma função ministerial? *</label>
          <input type="text" id="funcaoMinisterial" placeholder="Obreiro, diácono, pastor...">
        </div>
      </div>
      <div id="wrapVisitante" style="display:none">
        <label>Gostaria de participar de um Grupo de Crescimento? *</label>
        <div class="seg" id="segGC">
          <button type="button" data-v="Sim" onclick="setSeg('segGC','quisGC',this)">Sim</button>
          <button type="button" data-v="Não" onclick="setSeg('segGC','quisGC',this)">Não</button>
        </div>
        <input type="hidden" id="quisGC">
      </div>
      <label>Observação (opcional)</label>
      <textarea id="notas" rows="3" placeholder="Alguma informação extra que ache importante registrar..."></textarea>
      <label>Quem está coletando essas informações? *</label>
      <div class="form-section">Responsável pelo cadastro</div>
      <div class="seg" id="segColeta">
        <button type="button" data-v="Equipe de recepção" onclick="setColeta(this)">Equipe de recepção</button>
        <button type="button" data-v="Departamento" onclick="setColeta(this)">Departamento</button>
      </div>
      <input type="hidden" id="quemColeta">
      <label>Seu nome (quem está cadastrando) *</label>
      <input type="text" id="nomeCadastrador" placeholder="Digite seu nome completo">
      <div id="wrapDepartamento" class="conditional" style="display:none">
        <label>Qual departamento? *</label>
        <select id="departamento">
          <option value="">Selecione</option>
        </select>
      </div>
      <button class="btn-ember block" style="margin-top:22px" onclick="enviar()">
        <i class="ti ti-send"></i>Enviar cadastro
      </button>
    </div>
  </div>
  <div class="success" id="successScreen">
    <div class="ic"><i class="ti ti-check"></i></div>
    <h2>Cadastro enviado!</h2>
    <p>A pessoa já entrou na jornada certinha.</p>
    <button class="btn-primary block" onclick="novoCadastro()"><i class="ti ti-user-plus"></i>Cadastrar outra pessoa</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="store.js"></script>
<script>
var categoriaAtual = null;
(function(){
  var sel = document.getElementById('departamento');
  var depts = Store.getDepartamentos();
  depts.forEach(function(d){
    var opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    sel.appendChild(opt);
  });
})();
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function toggleConjugeCampo(){
  var estadoCivil = document.getElementById('estadoCivil').value;
  var wrap = document.getElementById('wrapConjuge');
  var input = document.getElementById('nomeConjuge');
  var mostrar = estadoCivil === 'Casado(a)';
  wrap.style.display = mostrar ? 'block' : 'none';
  if(!mostrar){ input.value = ''; }
}
function setCategoria(btn){
  document.querySelectorAll('#categoriaSeg button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  categoriaAtual = btn.dataset.v;
  document.getElementById('wrapComum').style.display = 'block';
  document.getElementById('wrapReconciliado').style.display = categoriaAtual === 'reconciliado' ? 'block' : 'none';
  document.getElementById('wrapNovoMembro').style.display = categoriaAtual === 'novo_membro' ? 'block' : 'none';
  document.getElementById('wrapVisitante').style.display = categoriaAtual === 'visitante' ? 'block' : 'none';
}
function setSeg(groupId, hiddenId, btn){
  document.querySelectorAll('#' + groupId + ' button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById(hiddenId).value = btn.dataset.v;
  if(hiddenId === 'temCarta'){
    document.getElementById('wrapFuncao').style.display = btn.dataset.v === 'Sim' ? 'block' : 'none';
  }
}
function setColeta(btn){
  document.querySelectorAll('#segColeta button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('quemColeta').value = btn.dataset.v;
  document.getElementById('wrapDepartamento').style.display = btn.dataset.v === 'Departamento' ? 'block' : 'none';
}
function enviar(){
  var nome = document.getElementById('nome').value.trim();
  if(!nome){ showToast('Preencha o nome completo.'); return; }
  var telefone = document.getElementById('telefone').value.trim();
  if(!telefone){ showToast('Preencha o WhatsApp.'); return; }
  var email = document.getElementById('email').value.trim();
  if(!email){ showToast('Preencha o e-mail.'); return; }
  var congregacao = document.getElementById('congregacao').value;
  if(!congregacao){ showToast('Selecione a igreja que a pessoa frequenta.'); return; }
  if(!categoriaAtual){ showToast('Escolha a situação da pessoa.'); return; }
  var bairro = document.getElementById('bairro').value.trim();
  if(!bairro){ showToast('Preencha o bairro.'); return; }
  var idade = document.getElementById('idade').value.trim();
  if(!idade){ showToast('Preencha a idade.'); return; }
  var estadoCivil = document.getElementById('estadoCivil').value;
  if(!estadoCivil){ showToast('Selecione o estado civil.'); return; }
  var nomeConjuge = document.getElementById('nomeConjuge').value.trim();
  if(estadoCivil === 'Casado(a)' && !nomeConjuge){ showToast('Digite o nome do cônjuge.'); return; }
  if(categoriaAtual === 'reconciliado'){
    var igreja = document.getElementById('igrejaAnterior').value.trim();
    if(!igreja){ showToast('Preencha em qual igreja aceitou Jesus.'); return; }
  }
  if(categoriaAtual === 'novo_membro'){
    var temCarta = document.getElementById('temCarta').value;
    if(!temCarta){ showToast('Selecione se tem carta de transferência.'); return; }
    if(temCarta === 'Sim'){
      var funcao = document.getElementById('funcaoMinisterial').value.trim();
      if(!funcao){ showToast('Preencha a função ministerial.'); return; }
    }
  }
  if(categoriaAtual === 'visitante'){
    var quisGC = document.getElementById('quisGC').value;
    if(!quisGC){ showToast('Selecione se gostaria de participar de um GC.'); return; }
  }
  var quemColeta = document.getElementById('quemColeta').value;
  if(!quemColeta){ showToast('Selecione quem está coletando as informações.'); return; }
  if(quemColeta === 'Departamento'){
    var depto = document.getElementById('departamento').value;
    if(!depto){ showToast('Selecione o departamento.'); return; }
  }
  var nomeCadastrador = document.getElementById('nomeCadastrador').value.trim();
  if(!nomeCadastrador){ showToast('Digite o nome de quem está cadastrando.'); return; }
  Store.addPerson({
    nome: nome,
    telefone: telefone,
    email: email,
    congregacao: congregacao,
    bairro: bairro,
    idade: idade,
    estadoCivil: estadoCivil,
    nomeConjuge: nomeConjuge,
    igrejaAnterior: document.getElementById('igrejaAnterior').value.trim(),
    temCarta: document.getElementById('temCarta').value,
    funcaoMinisterial: document.getElementById('funcaoMinisterial').value.trim(),
    quisGC: document.getElementById('quisGC').value,
    notas: document.getElementById('notas').value.trim(),
    nomeCadastrador: nomeCadastrador,
    quemColeta: quemColeta,
    departamento: document.getElementById('departamento').value,
    stage: categoriaAtual
  });
  document.getElementById('formScreen').style.display = 'none';
  document.getElementById('successScreen').style.display = 'block';
}
function novoCadastro(){
  var ids = ['nome','telefone','email','bairro','idade','igrejaAnterior','funcaoMinisterial','notas','nomeCadastrador'];
  ids.forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('congregacao').value = '';
  document.getElementById('estadoCivil').value = '';
  document.getElementById('nomeConjuge').value = '';
  document.getElementById('temCarta').value = '';
  document.getElementById('quisGC').value = '';
  document.getElementById('quemColeta').value = '';
  document.getElementById('departamento').value = '';
  categoriaAtual = null;
  document.querySelectorAll('.seg button').forEach(function(b){ b.classList.remove('active'); });
  var wraps = ['wrapComum','wrapConjuge','wrapReconciliado','wrapNovoMembro','wrapVisitante','wrapFuncao','wrapDepartamento'];
  wraps.forEach(function(id){ document.getElementById(id).style.display = 'none'; });
  document.getElementById('successScreen').style.display = 'none';
  document.getElementById('formScreen').style.display = 'block';
}
</script>
</body>
</html>
